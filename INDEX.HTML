            "Kupwara": kupwaraHospitals, "Kulgam": kulgamHospitals, "Pulwama": pulwamaHospitals, "Shopian": shopianHospitals
        };
        const policeDatabase = {
            "Srinagar": srinagarPolice, "Anantnag": anantnagPolice, "Baramulla": baramullaPolice,
            "Budgam": budgamPolice, "Bandipora": bandiporaPolice, "Ganderbal": ganderbalPolice,
            "Kupwara": kupwaraPolice, "Kulgam": kulgamPolice, "Pulwama": pulwamaPolice, "Shopian": shopianPolice
        };
        const fireDatabase = {
            "Srinagar": srinagarFire, "Anantnag": anantnagFire, "Baramulla": baramullaFire,
            "Budgam": budgamFire, "Bandipora": bandiporaFire, "Ganderbal": ganderbalFire,
            "Kupwara": kupwaraFire, "Kulgam": kulgamFire, "Pulwama": pulwamaFire, "Shopian": shopianFire
        };

        const districts = ["Srinagar", "Anantnag", "Baramulla", "Budgam", "Bandipora", "Ganderbal", "Kupwara", "Kulgam", "Pulwama", "Shopian"];
        
        const STORAGE_CURRENT = "ks_currentUser";
        const STORAGE_REQUESTS = "ks_emergency_requests";

        let currentUser = null;

        function getNearestService(district, type) {
            let database;
            if (type === "medical") database = hospitalsDatabase;
            else if (type === "police") database = policeDatabase;
            else if (type === "fire") database = fireDatabase;
            else if (type === "disaster") return disasterDatabase[district];
            else return { name: "Emergency Services", phone: "112", distance: "Call Immediately" };
            const services = database[district];
            if (services && services.length > 0) return services[0];
            return { name: `${type.toUpperCase()} Emergency`, phone: type === "medical" ? "102" : type === "police" ? "100" : "101", distance: "Contact" };
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.background = isError ? '#dc2626' : '#1f2937';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function getCurrentLocation() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => resolve({ lat: position.coords.latitude, lng: position.coords.longitude }),
                        () => resolve({ lat: 34.074, lng: 74.806, isDemo: true })
                    );
                } else { resolve({ lat: 34.074, lng: 74.806, isDemo: true }); }
            });
        }

        function saveEmergencyRequest(request) {
            request.id = Date.now().toString();
            request.timestamp = new Date().toISOString();
            request.status = "pending";
            
            // Push to Firebase Realtime Database
            db.ref('emergencies/' + request.id).set(request)
              .catch(e => console.error("Firebase save error:", e));
              
            return request;
        }

        async function getLocationForForm() {
            const locationText = document.getElementById('locationText');
            const locationInput = document.getElementById('emergencyLocation');
            if (locationText) locationText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Getting location...';
            try {
                const location = await getCurrentLocation();
                if (locationInput) locationInput.value = location.isDemo ? "Srinagar, Kashmir (Demo)" : `${location.lat.toFixed(6)}, ${location.lng.toFixed(6)}`;
                if (locationText) locationText.innerHTML = '<i class="fas fa-check-circle" style="color: #10b981;"></i> Location captured!';
                showToast("📍 Location captured!");
            } catch (error) {
                if (locationText) locationText.innerHTML = '<i class="fas fa-exclamation-circle" style="color: #ef4444;"></i> Could not get location';
                showToast("⚠️ Please enter location manually", true);
            }
        }

        function openEmergencyForm(type) {
            playSOSSound();
            const modal = document.getElementById('emergencyModal');
            const modalBody = document.getElementById('modalBody');
            const typeNames = { police: t('policeEmergency'), medical: t('medicalEmergency'), fire: t('fireEmergency'), disaster: t('disasterAlert'), sos: t('policeEmergency') };
            modalBody.innerHTML = `
                <form id="emergencyForm" onsubmit="sendEmergency(event)">
                    <div class="form-group"><label>${t('fullName')} *</label><input type="text" id="userName" value="${currentUser?.name || ''}" required></div>
                    <div class="form-row"><div class="form-group"><label>${t('phoneNum')} *</label><input type="tel" id="userPhone" value="${currentUser?.phone || ''}" required></div><div class="form-group"><label>${t('age')}</label><input type="number" id="userAge" placeholder="${t('age')}"></div></div>
                    <div class="form-group"><label>${t('location')} *</label><input type="text" id="emergencyLocation" required placeholder="Street, landmark, area"><div class="location-status"><i class="fas fa-map-marker-alt"></i> <span id="locationText">Click below to auto-detect</span></div><button type="button" class="get-location-btn" onclick="getLocationForForm()"><i class="fas fa-location-dot"></i> ${t('getLocation')}</button></div>
                    <div class="form-row"><div class="form-group"><label>${t('district')} *</label><select id="userDistrict" required><option value="">Select District</option>${districts.map(d => `<option value="${d}">${d}</option>`).join('')}</select></div><div class="form-group"><label>${t('emergencyType')}</label><input type="text" value="${typeNames[type]}" readonly style="background:#fee2e2; font-weight:700; color:#dc2626;"></div></div>
                    <div class="form-group"><label>${t('describe')} *</label><textarea id="emergencyDetails" rows="3" required placeholder="What happened? How many people?"></textarea></div>
                    <div class="form-group"><label>${t('peopleAffected')}</label><input type="text" id="peopleAffected" placeholder="e.g., 1, 2, 5"></div>
                    <div class="form-group"><label class="radio-option"><input type="checkbox" id="confirmDetails" required> <span>${t('confirm')}</span></label></div>
                    <button type="submit" class="send-sos-btn"><i class="fas fa-paper-plane"></i> ${t('sendAlert')}</button>
                </form>
            `;
            modal.classList.add('active');
        }

        function sendEmergency(event) {
            event.preventDefault();
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const location = document.getElementById('emergencyLocation').value;
            const district = document.getElementById('userDistrict').value;
            const details = document.getElementById('emergencyDetails').value;
            if (!name || !phone || !location || !district || !details) { showToast(t('fillRequired'), true); return; }
            if (!/^\d{10}$/.test(phone)) { showToast(t('validPhone'), true); return; }
            if (!document.getElementById('confirmDetails').checked) { showToast(t('confirmCheck'), true); return; }
            const emergencyTypeInput = document.querySelector('#modalBody input[readonly]');
            let type = "police";
            if (emergencyTypeInput?.value.includes("MEDICAL") || emergencyTypeInput?.value.includes("चिकित्सा")) type = "medical";
            else if (emergencyTypeInput?.value.includes("FIRE") || emergencyTypeInput?.value.includes("अग्नि")) type = "fire";
            else if (emergencyTypeInput?.value.includes("DISASTER") || emergencyTypeInput?.value.includes("आपदा")) type = "disaster";
            const nearest = getNearestService(district, type);
            const emergencyData = { userName: name, userPhone: phone, location: location, district: district, type: type, nearestService: nearest.name, nearestServicePhone: nearest.phone, details: details, peopleAffected: document.getElementById('peopleAffected').value || "1", status: "pending" };
            saveEmergencyRequest(emergencyData);
            showToast(`✅ ${t('alertSent')} ${nearest.name} ${t('helpOnWay')}`);
            closeModal();
            renderApp();
        }

        function closeModal() { document.getElementById('emergencyModal')?.classList.remove('active'); }
        function callNumber(num) { window.location.href = `tel:${num}`; showToast(`${t('calling')} ${num}...`); }
        
        // ==================== OTP FUNCTIONS WITH VISIBLE OTP ====================
        function generateOTP() { 
            return Math.floor(100000 + Math.random() * 900000).toString(); 
        }
        
        function sendLoginOTP() {
            const phone = document.getElementById('loginPhone').value.trim();
            const name = document.getElementById('loginName').value.trim();
            if (!phone) { showToast(t('fillRequired'), true); return; }
            if (!/^\d{10}$/.test(phone)) { showToast(t('validPhone'), true); return; }
            
            const otp = generateOTP();
            localStorage.setItem(`otp_${phone}`, otp);
            localStorage.setItem(`otp_time_${phone}`, Date.now().toString());
            localStorage.setItem(`pending_name_${phone}`, name || "Emergency User");
            
            // OTP Show - Multiple ways to ensure visibility
            document.getElementById('otpSection').style.display = 'block';
            
            // Show OTP in a styled div
            const otpDiv = document.getElementById('otpDisplayDiv');
            if (otpDiv) {
                otpDiv.innerHTML = `<div class="otp-display"><i class="fas fa-key"></i> Your OTP: <strong style="font-size:1.5rem;">${otp}</strong></div>`;
                otpDiv.style.display = 'block';
            }
            
            // Show OTP in alert (most visible)
            alert(`🔐 YOUR OTP IS: ${otp}\n\nPlease enter this 6-digit code to verify your number.\n\n(OTP valid for 5 minutes)`);
            
            // Show OTP in toast
            showToast(`📱 ${t('otpSent')} ${phone}: ${otp}`, 8000);
            
            console.log(`OTP for ${phone}: ${otp}`);
        }

        function verifyLoginOTP() {
            const phone = document.getElementById('loginPhone').value.trim();
            const otp = document.getElementById('loginOTP').value.trim();
            const savedOTP = localStorage.getItem(`otp_${phone}`);
            const otpTime = localStorage.getItem(`otp_time_${phone}`);
            
            if (!savedOTP) { showToast("❌ No OTP sent. Please request OTP first.", true); return; }
            if (!otp) { showToast("❌ Please enter OTP", true); return; }
            if (Date.now() - parseInt(otpTime) > 300000) { showToast("❌ OTP expired. Please request again.", true); return; }
            
            if (savedOTP === otp) {
                const name = localStorage.getItem(`pending_name_${phone}`) || "Emergency User";
                currentUser = { name: name, phone: phone, isLoggedIn: true, loginTime: Date.now() };
                localStorage.setItem(STORAGE_CURRENT, JSON.stringify(currentUser));
                // Clear OTP display
                const otpDiv = document.getElementById('otpDisplayDiv');
                if (otpDiv) otpDiv.style.display = 'none';
                renderApp();
                showToast(`✅ ${t('welcome')}`);
            } else { 
                showToast("❌ Invalid OTP. Please check and try again.", true); 
            }
        }

        function logout() { 
            currentUser = null; 
            localStorage.removeItem(STORAGE_CURRENT); 
            renderApp(); 
        }
        
        function changeLang(lang) { currentLang = lang; renderApp(); }

        function renderLogin() {
            return `
                <div class="sos-card">
                    <div class="header"><div class="logo"><i class="fas fa-shield-alt"></i></div><h1>${t('appName')}</h1><p>${t('tagline')}</p>
                    <div class="lang-selector"><button class="lang-btn ${currentLang === 'en' ? 'active' : ''}" onclick="changeLang('en')">English</button><button class="lang-btn ${currentLang === 'hi' ? 'active' : ''}" onclick="changeLang('hi')">हिंदी</button><button class="lang-btn ${currentLang === 'ur' ? 'active' : ''}" onclick="changeLang('ur')">اردو</button></div></div>
                    <div class="login-section">
                        <h3><i class="fas fa-user-plus"></i> ${t('loginTitle')}</h3>
                        <input type="tel" id="loginPhone" class="login-input" placeholder="${t('phone')}" value="9901234567">
                        <input type="text" id="loginName" class="login-input" placeholder="${t('name')}" value="Emergency User">
                        <button onclick="sendLoginOTP()" class="login-btn"><i class="fas fa-paper-plane"></i> ${t('loginBtn')}</button>
                        <div id="otpDisplayDiv" style="display:none; margin: 10px 0;"></div>
                        <div id="otpSection" style="display:none; margin-top:15px;">
                            <input type="text" id="loginOTP" class="login-input" placeholder="${t('otpVerify')}">
                            <button onclick="verifyLoginOTP()" class="login-btn" style="background:#10b981;"><i class="fas fa-check"></i> ${t('verifyBtn')}</button>
                        </div>
                    </div>
                    <div class="helplines"><h3><i class="fas fa-phone-alt"></i> ${t('helplines')}</h3><div class="helpline-grid">
                        <div class="helpline-item" onclick="callNumber('100')"><i class="fas fa-shield-haltered" style="color:#3b82f6;"></i><div class="number">100</div><div class="label">Police</div></div>
                        <div class="helpline-item" onclick="callNumber('102')"><i class="fas fa-ambulance" style="color:#10b981;"></i><div class="number">102</div><div class="label">Ambulance</div></div>
                        <div class="helpline-item" onclick="callNumber('101')"><i class="fas fa-fire-extinguisher" style="color:#f59e0b;"></i><div class="number">101</div><div class="label">Fire</div></div>
                        <div class="helpline-item" onclick="callNumber('1090')"><i class="fas fa-female" style="color:#ec489a;"></i><div class="number">1090</div><div class="label">Women</div></div>
                        <div class="helpline-item" onclick="callNumber('1098')"><i class="fas fa-child" style="color:#f59e0b;"></i><div class="number">1098</div><div class="label">Child</div></div>
                        <div class="helpline-item" onclick="callNumber('1077')"><i class="fas fa-cloud-rain" style="color:#ef4444;"></i><div class="number">1077</div><div class="label">Disaster</div></div>
                    </div></div>
                    <div class="footer-links"><a href="privacy.html"><i class="fas fa-shield-alt"></i> ${t('privacyPolicy')}</a><span>|</span><a href="#"><i class="fas fa-envelope"></i> ${t('contact')}</a><span>|</span><span>${t('version')} 1.0</span></div>
                </div>
            `;
        }

        function renderMainApp() {
            return `
                <div class="sos-card">
                    <div class="header"><div class="logo"><i class="fas fa-shield-alt"></i></div><h1>${t('appName')}</h1><p>${t('tagline')}</p>
                    <div class="lang-selector"><button class="lang-btn ${currentLang === 'en' ? 'active' : ''}" onclick="changeLang('en')">English</button><button class="lang-btn ${currentLang === 'hi' ? 'active' : ''}" onclick="changeLang('hi')">हिंदी</button><button class="lang-btn ${currentLang === 'ur' ? 'active' : ''}" onclick="changeLang('ur')">اردو</button></div></div>
                    <div class="user-info"><div class="user-name"><i class="fas fa-user-circle"></i> ${currentUser?.name} (${currentUser?.phone})</div><button onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> ${t('logout')}</button></div>
                    <div class="sos-btn-area"><div class="sos-main-btn" onclick="openEmergencyForm('sos')"><i class="fas fa-exclamation-triangle"></i><span>${t('sos')}</span></div></div>
                    <div class="emergency-types"><div class="type-btn police" onclick="openEmergencyForm('police')"><i class="fas fa-shield-haltered"></i><span>${t('police')}</span></div><div class="type-btn medical" onclick="openEmergencyForm('medical')"><i class="fas fa-ambulance"></i><span>${t('medical')}</span></div><div class="type-btn fire" onclick="openEmergencyForm('fire')"><i class="fas fa-fire-extinguisher"></i><span>${t('fire')}</span></div><div class="type-btn disaster" onclick="openEmergencyForm('disaster')"><i class="fas fa-cloud-rain"></i><span>${t('disaster')}</span></div></div>
                    <div class="helplines"><h3><i class="fas fa-phone-alt"></i> ${t('helplines')}</h3><div class="helpline-grid">
                        <div class="helpline-item" onclick="callNumber('100')"><i class="fas fa-shield-haltered" style="color:#3b82f6;"></i><div class="number">100</div><div class="label">Police</div></div>
                        <div class="helpline-item" onclick="callNumber('102')"><i class="fas fa-ambulance" style="color:#10b981;"></i><div class="number">102</div><div class="label">Ambulance</div></div>
                        <div class="helpline-item" onclick="callNumber('101')"><i class="fas fa-fire-extinguisher" style="color:#f59e0b;"></i><div class="number">101</div><div class="label">Fire</div></div>
                        <div class="helpline-item" onclick="callNumber('1090')"><i class="fas fa-female" style="color:#ec489a;"></i><div class="number">1090</div><div class="label">Women</div></div>
                        <div class="helpline-item" onclick="callNumber('1098')"><i class="fas fa-child" style="color:#f59e0b;"></i><div class="number">1098</div><div class="label">Child</div></div>
                        <div class="helpline-item" onclick="callNumber('1077')"><i class="fas fa-cloud-rain" style="color:#ef4444;"></i><div class="number">1077</div><div class="label">Disaster</div></div>
                    </div></div>
                    <div class="footer-links"><a href="privacy.html"><i class="fas fa-shield-alt"></i> ${t('privacyPolicy')}</a><span>|</span><a href="#"><i class="fas fa-envelope"></i> ${t('contact')}</a><span>|</span><span>${t('version')} 1.0</span></div>
                </div>
                <div id="emergencyModal" class="modal"><div class="modal-content"><div class="modal-header"><h2><i class="fas fa-exclamation-triangle"></i> ${t('emergencyForm')}</h2><button class="close-modal" onclick="closeModal()">&times;</button></div><div id="modalBody"></div></div></div>
                <div id="toast" class="toast"></div>
            `;
        }

        function renderApp() {
            const app = document.getElementById('app');
            if (!currentUser || !currentUser.isLoggedIn) app.innerHTML = renderLogin();
            else app.innerHTML = renderMainApp();
        }

        window.logout = logout; window.openEmergencyForm = openEmergencyForm;
        window.closeModal = closeModal; window.getLocationForForm = getLocationForForm;
        window.callNumber = callNumber; window.sendEmergency = sendEmergency; window.changeLang = changeLang;
        window.sendLoginOTP = sendLoginOTP; window.verifyLoginOTP = verifyLoginOTP;

        const stored = localStorage.getItem(STORAGE_CURRENT);
        if (stored) { currentUser = JSON.parse(stored); if (currentUser?.isLoggedIn) currentUser.isLoggedIn = true; }
        renderApp();
    </script>
</body>
</html>
